{
  "name": "Publish verified Guoju installer",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "release/latest.json",
        ".github/workflows/publish-guoju.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "guoju-installer-release",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "GH_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "name": "Read and validate release descriptor",
          "id": "prepare",
          "run": "set -euo pipefail\ngh api \"repos/$GITHUB_REPOSITORY/contents/release/latest.json?ref=$GITHUB_SHA\" --jq .content | base64 --decode > release.json\npython3 - <<'PYCODE'\nimport json,os,re\nfrom urllib.parse import urlparse\nfrom pathlib import Path\nd=json.loads(Path('release.json').read_text())\nassert re.fullmatch(r'v[0-9]+\\.[0-9]+\\.[0-9]+',d['tag'])\nassert d['version']==d['tag'][1:]\nassert d['name']=='GuojuDesktop-'+d['version']+'-win-x64.exe'\nassert d['url']=='https://together.qqkid.link/updates/guoju/files/'+d['name']\nassert re.fullmatch(r'[a-f0-9]{64}',d['sha256']) and 20*1024**2<=d['size']<=600*1024**2\nPath('release-notes.md').write_text(d['notes'])\nwith open(os.environ['GITHUB_OUTPUT'],'a') as f:\n for k in ['tag','version','name','url','sha256','size']: f.write(k+'='+str(d[k])+'\\n')\nPYCODE"
        },
        {
          "name": "Download and verify the deployed installer",
          "env": {
            "ASSET_NAME": "${{ steps.prepare.outputs.name }}",
            "ASSET_URL": "${{ steps.prepare.outputs.url }}",
            "ASSET_SHA": "${{ steps.prepare.outputs.sha256 }}",
            "ASSET_SIZE": "${{ steps.prepare.outputs.size }}"
          },
          "run": "set -euo pipefail\ncurl --proto '=https' --tlsv1.2 --fail --location --retry 3 --connect-timeout 15 --max-time 600 \"$ASSET_URL\" --output \"$ASSET_NAME\"\nprintf '%s  %s\\n' \"$ASSET_SHA\" \"$ASSET_NAME\" | sha256sum --check --strict -\npython3 - <<'PYCODE'\nimport os\nassert os.path.getsize(os.environ['ASSET_NAME'])==int(os.environ['ASSET_SIZE'])\nPYCODE"
        },
        {
          "name": "Upload, verify and publish release",
          "env": {
            "RELEASE_TAG": "${{ steps.prepare.outputs.tag }}",
            "ASSET_NAME": "${{ steps.prepare.outputs.name }}",
            "ASSET_SHA": "${{ steps.prepare.outputs.sha256 }}",
            "ASSET_SIZE": "${{ steps.prepare.outputs.size }}"
          },
          "run": "set -euo pipefail\ngh api \"repos/$GITHUB_REPOSITORY/releases?per_page=100\" > releases.json\nRELEASE_ID=$(python3 - <<'PYCODE'\nimport json,os\nfrom pathlib import Path\nfound=next((r for r in json.loads(Path('releases.json').read_text()) if r['tag_name']==os.environ['RELEASE_TAG']),None)\nprint(found['id'] if found else '')\nPYCODE\n)\nif [ -z \"$RELEASE_ID\" ]; then\n python3 - <<'PYCODE'\nimport json,os\nfrom pathlib import Path\nPath('create-release.json').write_text(json.dumps({'tag_name':os.environ['RELEASE_TAG'],'target_commitish':os.environ['GITHUB_SHA'],'name':'果剧桌面 '+os.environ['RELEASE_TAG'],'body':Path('release-notes.md').read_text(),'draft':True,'prerelease':False}))\nPYCODE\n gh api --method POST \"repos/$GITHUB_REPOSITORY/releases\" --input create-release.json > created-release.json\n RELEASE_ID=$(python3 -c 'import json;print(json.load(open(\"created-release.json\"))[\"id\"])')\nfi\nexport RELEASE_ID\ngh api \"repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID\" > existing-release.json\nASSET_EXISTS=$(python3 - <<'PYCODE'\nimport json,os\nfrom pathlib import Path\nassets=json.loads(Path('existing-release.json').read_text())['assets']\nexisting=next((a for a in assets if a['name']==os.environ['ASSET_NAME']),None)\nif existing: assert existing.get('digest')=='sha256:'+os.environ['ASSET_SHA'] and existing['size']==int(os.environ['ASSET_SIZE']), 'Existing asset differs; refusing to overwrite'\nprint('true' if existing else 'false')\nPYCODE\n)\nif [ \"$ASSET_EXISTS\" != 'true' ]; then\n curl --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 15 --max-time 600 --request POST --header \"Authorization: Bearer $GH_TOKEN\" --header 'Content-Type: application/octet-stream' --data-binary \"@$ASSET_NAME\" \"https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ASSET_NAME\" > uploaded-asset.json\nfi\ngh api \"repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID\" > uploaded-release.json\ngh api \"repos/$GITHUB_REPOSITORY/releases/latest\" > latest-release.json || echo '{}' > latest-release.json\npython3 - <<'PYCODE'\nimport json,os,re\nfrom pathlib import Path\nrelease=json.loads(Path('uploaded-release.json').read_text())\nasset=next(a for a in release['assets'] if a['name']==os.environ['ASSET_NAME'])\nassert asset.get('digest')=='sha256:'+os.environ['ASSET_SHA'] and asset['size']==int(os.environ['ASSET_SIZE'])\ndef version(tag):\n match=re.fullmatch(r'v?([0-9]+)\\.([0-9]+)\\.([0-9]+)',tag or '')\n return tuple(map(int,match.groups())) if match else (0,0,0)\nlatest=json.loads(Path('latest-release.json').read_text())\nmake_latest='false' if version(latest.get('tag_name'))>version(os.environ['RELEASE_TAG']) else 'true'\nPath('publish-release.json').write_text(json.dumps({'draft':False,'make_latest':make_latest,'name':'果剧桌面 '+os.environ['RELEASE_TAG'],'body':Path('release-notes.md').read_text()}))\nPYCODE\ngh api --method PATCH \"repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID\" --input publish-release.json --jq .html_url\n"
        }
      ]
    }
  }
}
