<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d1a"/>
      <stop offset="1" stop-color="#140e0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#ff6a3d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fruit" cx="0.36" cy="0.3" r="0.82">
      <stop offset="0" stop-color="#ff9a5a"/>
      <stop offset="0.38" stop-color="#ff5a3c"/>
      <stop offset="0.78" stop-color="#e3203a"/>
      <stop offset="1" stop-color="#a80f2a"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2e9e4f"/>
      <stop offset="1" stop-color="#8be07a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>

  <!-- shadow under the fruit -->
  <ellipse cx="256" cy="430" rx="132" ry="24" fill="#000" opacity="0.45" filter="url(#soft)"/>

  <!-- fruit body: a round fruit with a soft dimple at the top -->
  <path d="M256 150
           C 290 128, 352 124, 392 160
           C 440 204, 446 286, 412 350
           C 380 410, 318 438, 256 438
           C 194 438, 132 410, 100 350
           C 66 286, 72 204, 120 160
           C 160 124, 222 128, 256 150 Z" fill="url(#fruit)"/>
  <!-- glossy highlight -->
  <path d="M150 196 C 176 168, 222 160, 246 172 C 214 182, 182 210, 164 252 C 150 242, 142 214, 150 196 Z" fill="url(#shine)"/>

  <!-- stem and leaf -->
  <path d="M256 156 C 254 128, 262 104, 280 86" fill="none" stroke="#5a2e1c" stroke-width="13" stroke-linecap="round"/>
  <path d="M272 108 C 300 66, 360 58, 398 74 C 380 112, 330 138, 272 120 Z" fill="url(#leaf)"/>
  <path d="M282 114 C 316 100, 350 88, 382 78" fill="none" stroke="#1f7a3a" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>

  <!-- play mark -->
  <path d="M222 236 C 222 220, 239 210, 253 218 L 338 268 C 352 276, 352 296, 338 304 L 253 354 C 239 362, 222 352, 222 336 Z" fill="#ffffff"/>
</svg>
